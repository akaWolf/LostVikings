name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Lower default token to read; release job opts in to write.
permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 (release, static C++ runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libsdl2-dev pkg-config

      # HEADLESS build first so the smoke test can run before we touch the
      # release artifact. .obj-headless and .obj are separate trees, so the
      # subsequent default build does not need a `make clean` in between.
      - name: Build HEADLESS variant
        # clang: v2_vm.cpp (with the transpiled executors since stage 3A) needs
        # > 8 GB under gcc and dies on the 16 GB runner; clang peaks at ~1.2 GB.
        # ulimit: clang's parser needs a deep stack for the 40k-line executor.
        run: ulimit -s unlimited && HEADLESS=1 make CXX=clang++ RELEASE=1 STATIC=1 SDL_STATIC=1 -j$(nproc)

      # Optional gameplay-test asset fetch.
      # DATA.DAT is the copyrighted 1992 asset file — NOT in the repo. If a
      # private URL is configured in the DATA_DAT_URL repo secret, fetch it
      # here so the smoke test exercises real gameplay instead of just init.
      # Without the secret, the test still runs but exits right after init
      # ("AIL sub_1754c: exit", al=0) — that still catches segfault, link
      # errors, SDL dummy driver bugs and replay-parser regressions.
      #
      # Setup:
      #   gh secret set DATA_DAT_URL --body 'https://user:pass@host/DATA.DAT'
      # The secret value is masked in logs by GitHub Actions automatically.
      - name: Cache DATA.DAT
        id: data_cache
        uses: actions/cache@v4
        with:
          path: DATA.DAT
          key: datafile-v1

      - name: Fetch DATA.DAT (cache miss only)
        if: steps.data_cache.outputs.cache-hit != 'true'
        env:
          DATA_DAT_URL: ${{ secrets.DATA_DAT_URL }}
        run: |
          if [ -z "$DATA_DAT_URL" ]; then
            echo "DATA_DAT_URL secret not set — smoke will run init-only"
            exit 0
          fi
          curl --fail --silent --show-error --location \
               --output DATA.DAT "$DATA_DAT_URL"
          echo "Fetched DATA.DAT:"
          ls -lh DATA.DAT
          sha256sum DATA.DAT

      - name: Smoke test
        run: ./tests/smoke.sh

      # Curated gameplay replays (tests/replays/*.inp) verified bit-for-bit
      # against the original (orig vs v2 mirror) under HEADLESS. Each replay runs
      # for exactly its recorded session length (tests/replays/<name>.frames).
      # Needs real DATA.DAT — skipped on forks/PRs where the secret is absent.
      # Runs the replays in parallel across the runner's cores (JOBS=nproc).
      - name: Scenario replays
        if: hashFiles('DATA.DAT') != ''
        run: ./tests/scenarios.sh

      - name: Build release vikings (RELEASE=1 STATIC=1 SDL_STATIC=1)
        run: ulimit -s unlimited && make CXX=clang++ RELEASE=1 STATIC=1 SDL_STATIC=1 -j$(nproc)

      - name: Build keymap editor
        run: make keymap_editor CXX=clang++ STATIC=1 SDL_STATIC=1

      - name: Verify static linkage (C++ runtime + SDL2)
        run: |
          if ldd vikings | grep -E 'libstdc\+\+|libgcc_s|libSDL2'; then
            echo "ERROR: libgcc/libstdc++/libSDL2 are dynamically linked"; exit 1
          fi
          echo "OK: C++ runtime and SDL2 both statically linked"
          ldd vikings

      - name: Package
        run: |
          mkdir -p dist/vikings-linux-x86_64
          cp vikings vikings_keymap_editor vikings_keymap.cfg dist/vikings-linux-x86_64/
          # Static DS / EXE blobs needed at runtime by the v2 mirror.
          cp ds_static.bin exe_static.bin dist/vikings-linux-x86_64/
          [ -f README.md ] && cp README.md dist/vikings-linux-x86_64/
          tar -czf vikings-linux-x86_64.tar.gz -C dist vikings-linux-x86_64
          ls -lh vikings-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: vikings-linux-x86_64
          path: vikings-linux-x86_64.tar.gz
          retention-days: 30

  windows:
    name: Windows x86_64 (mingw-w64 cross-compile)
    runs-on: ubuntu-latest
    env:
      SDL2_VERSION: 2.30.10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 mingw-w64-tools pkg-config wget unzip

      - name: Install SDL2 mingw devel into mingw sysroot
        # Ubuntu's x86_64-w64-mingw32-pkg-config hardcodes its own
        # PKG_CONFIG_PATH and ignores the env var (it is a shell-script
        # wrapper). Installing SDL2's mingw files directly into the mingw
        # sysroot is the reliable way to make the wrapper find them.
        run: |
          cd /tmp
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          tar -xzf "SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          sudo cp -r "SDL2-${SDL2_VERSION}/x86_64-w64-mingw32/." /usr/x86_64-w64-mingw32/
          # NOTE: the official tarball's sdl2.pc hardcodes the libsdl-org
          # build-machine prefix (/tmp/tardir/...), and Ubuntu's mingw
          # pkg-config wrapper kept resolving that broken file even after a
          # prefix rewrite — so the build steps below bypass pkg-config
          # entirely and pass the SDL flags to make explicitly.
          ls /usr/x86_64-w64-mingw32/include/SDL2/SDL.h

      - name: Build (WIN=1 RELEASE=1 SDL_STATIC=1)
        run: |
          SDLP=/usr/x86_64-w64-mingw32
          # -j1: mingw gcc on v2_vm.cpp (the transpiled executors since stage 3A)
          # needs most of the 16 GB runner by itself — no parallel units beside it
          make WIN=1 RELEASE=1 SDL_STATIC=1 SDL="-I$SDLP/include -I$SDLP/include/SDL2 -L$SDLP/lib -lmingw32 -l:libSDL2.a -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid" -j1

      - name: Build keymap editor
        run: |
          SDLP=/usr/x86_64-w64-mingw32
          make keymap_editor WIN=1 RELEASE=1 SDL_STATIC=1 SDL="-I$SDLP/include -I$SDLP/include/SDL2 -L$SDLP/lib -lmingw32 -l:libSDL2.a -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid"

      - name: Package
        # SDL2 is fully static here, no SDL2.dll alongside the exe.
        run: |
          mkdir -p dist/vikings-windows-x86_64
          cp vikings.exe vikings_keymap_editor.exe vikings_keymap.cfg dist/vikings-windows-x86_64/
          # Static DS / EXE blobs needed at runtime by the v2 mirror.
          cp ds_static.bin exe_static.bin dist/vikings-windows-x86_64/
          [ -f README.md ] && cp README.md dist/vikings-windows-x86_64/
          cd dist && zip -r ../vikings-windows-x86_64.zip vikings-windows-x86_64
          ls -lh ../vikings-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vikings-windows-x86_64
          path: vikings-windows-x86_64.zip
          retention-days: 30

  linux-v2only:
    name: Linux x86_64 V2_ONLY (release, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libsdl2-dev pkg-config

      - name: Build (V2_ONLY=1 RELEASE=1 STATIC=1 SDL_STATIC=1)
        run: ulimit -s unlimited && V2_ONLY=1 make CXX=clang++ RELEASE=1 STATIC=1 SDL_STATIC=1 -j$(nproc)

      - name: Build keymap editor
        run: make keymap_editor CXX=clang++ STATIC=1 SDL_STATIC=1

      - name: Verify static linkage (C++ runtime + SDL2)
        run: |
          if ldd vikings | grep -E 'libstdc\+\+|libgcc_s|libSDL2'; then
            echo "ERROR: libgcc/libstdc++/libSDL2 are dynamically linked"; exit 1
          fi
          echo "OK: V2_ONLY binary, C++ runtime and SDL2 statically linked"
          ldd vikings

      - name: Package
        # V2_ONLY needs ds_static.bin + exe_static.bin at startup (static EXE
        # image that default mode reconstructs from m2c initialisers).
        # DATA.DAT (game assets) is still required — user supplies it.
        run: |
          mkdir -p dist/vikings-linux-x86_64-v2only
          cp vikings vikings_keymap_editor vikings_keymap.cfg dist/vikings-linux-x86_64-v2only/
          cp ds_static.bin exe_static.bin dist/vikings-linux-x86_64-v2only/
          [ -f README.md ] && cp README.md dist/vikings-linux-x86_64-v2only/
          tar -czf vikings-linux-x86_64-v2only.tar.gz -C dist vikings-linux-x86_64-v2only
          ls -lh vikings-linux-x86_64-v2only.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: vikings-linux-x86_64-v2only
          path: vikings-linux-x86_64-v2only.tar.gz
          retention-days: 30

  windows-v2only:
    name: Windows x86_64 V2_ONLY (mingw-w64 cross-compile)
    runs-on: ubuntu-latest
    env:
      SDL2_VERSION: 2.30.10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 mingw-w64-tools pkg-config wget unzip

      - name: Install SDL2 mingw devel into mingw sysroot
        run: |
          cd /tmp
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          tar -xzf "SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          sudo cp -r "SDL2-${SDL2_VERSION}/x86_64-w64-mingw32/." /usr/x86_64-w64-mingw32/
          # NOTE: the official tarball's sdl2.pc hardcodes the libsdl-org
          # build-machine prefix (/tmp/tardir/...), and Ubuntu's mingw
          # pkg-config wrapper kept resolving that broken file even after a
          # prefix rewrite — so the build steps below bypass pkg-config
          # entirely and pass the SDL flags to make explicitly.
          ls /usr/x86_64-w64-mingw32/include/SDL2/SDL.h

      - name: Build (V2_ONLY=1 WIN=1 RELEASE=1 SDL_STATIC=1)
        run: |
          SDLP=/usr/x86_64-w64-mingw32
          # -j1: see the Windows job above
          V2_ONLY=1 make WIN=1 RELEASE=1 SDL_STATIC=1 SDL="-I$SDLP/include -I$SDLP/include/SDL2 -L$SDLP/lib -lmingw32 -l:libSDL2.a -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid" -j1

      - name: Build keymap editor
        run: |
          SDLP=/usr/x86_64-w64-mingw32
          make keymap_editor WIN=1 RELEASE=1 SDL_STATIC=1 SDL="-I$SDLP/include -I$SDLP/include/SDL2 -L$SDLP/lib -lmingw32 -l:libSDL2.a -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid"

      - name: Package
        run: |
          mkdir -p dist/vikings-windows-x86_64-v2only
          cp vikings.exe vikings_keymap_editor.exe vikings_keymap.cfg dist/vikings-windows-x86_64-v2only/
          cp ds_static.bin exe_static.bin dist/vikings-windows-x86_64-v2only/
          [ -f README.md ] && cp README.md dist/vikings-windows-x86_64-v2only/
          cd dist && zip -r ../vikings-windows-x86_64-v2only.zip vikings-windows-x86_64-v2only
          ls -lh ../vikings-windows-x86_64-v2only.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vikings-windows-x86_64-v2only
          path: vikings-windows-x86_64-v2only.zip
          retention-days: 30

  release:
    # Auto-release on every push (any branch) and on tag pushes.
    # Tag push (v*)  → stable release named after the tag (becomes "Latest").
    # Branch commit  → pre-release named build-<run>-<short sha> with the
    #                  branch name in the body. Does not displace "Latest".
    # Skipped for PR events to avoid review-time spam.
    name: Publish GitHub release
    needs: [linux, windows, linux-v2only, windows-v2only]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-linux-x86_64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-windows-x86_64

      - name: Download Linux V2_ONLY artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-linux-x86_64-v2only

      - name: Download Windows V2_ONLY artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-windows-x86_64-v2only

      - name: Compute release metadata
        id: rel
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
            echo "name=$TAG"            >> "$GITHUB_OUTPUT"
            echo "prerelease=false"     >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA:0:8}"
            BRANCH="${GITHUB_REF#refs/heads/}"
            echo "tag=build-${{ github.run_number }}-$SHORT" >> "$GITHUB_OUTPUT"
            echo "name=Build ${{ github.run_number }} ($BRANCH @ $SHORT)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"      >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.rel.outputs.tag }}
          name:       ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          body: |
            Auto-build from commit ${{ github.sha }}.

            Assets:
            - `vikings-linux-x86_64.tar.gz`        — Linux x86_64, **default mode** (orig + v2 mirror)
            - `vikings-windows-x86_64.zip`         — Windows x86_64, default mode
            - `vikings-linux-x86_64-v2only.tar.gz` — Linux x86_64, **V2_ONLY** (standalone v2 build)
            - `vikings-windows-x86_64-v2only.zip`  — Windows x86_64, V2_ONLY

            All bundles contain `vikings`/`vikings.exe`, `vikings_keymap_editor`,
            `vikings_keymap.cfg`, `ds_static.bin` and `exe_static.bin`. SDL2 and
            the C++ runtime are statically linked — no extra DLLs/.so required.

            All modes require the copyrighted `DATA.DAT` from a legal copy of
            the 1992 Lost Vikings (e.g. the GOG release). It is not
            redistributed here. The bundled `*_static.bin` files hold the
            static EXE image (initial DS / text / tables) which V2_ONLY loads
            in place of m2c's C++ initialisers, not the game content.
          files: |
            vikings-linux-x86_64.tar.gz
            vikings-windows-x86_64.zip
            vikings-linux-x86_64-v2only.tar.gz
            vikings-windows-x86_64-v2only.zip

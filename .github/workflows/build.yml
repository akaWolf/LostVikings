name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Lower default token to read; release job opts in to write.
permissions:
  contents: read

jobs:
  # The tests and the release build are separate jobs: the HEADLESS binary
  # (.obj-headless) and the release binary (.obj) share no objects, and each
  # compile of the transpiled VM takes ~19 min on the hosted runners — run in
  # one job they were serial (HEADLESS 19 + replays 7 + release 19 = 46 min,
  # the critical path of the whole workflow); in two they overlap. The tests
  # still gate the published release through the `needs` of the release job.
  test:
    name: Tests ${{ matrix.arch }} (HEADLESS smoke + scenario replays)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: arm64,  runner: ubuntu-24.04-arm }   # GitHub's hosted arm64 Linux runner (public repos)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libsdl2-dev pkg-config

      - name: Generated-executor declarations are current (tools/data/gen_vm_decls.py --check)
        run: python3 tools/data/gen_vm_decls.py --check
      - name: Build the HEADLESS test-mode binary (the canon judge)
        # clang: v2_vm.cpp (with the transpiled executors since stage 3A) needs
        # > 8 GB under gcc and dies on the 16 GB runner; clang peaks at ~1.2 GB.
        # ulimit: clang's parser needs a deep stack for the 40k-line executor.
        run: |
          # the job log is not readable through the API without admin rights — on a
          # failure the first error lines are surfaced as annotations (check-run API)
          ulimit -s unlimited
          set -o pipefail
          free -g | sed -n 2p | sed 's/^/::notice::runner memory before the build: /'
          TEST=1 HEADLESS=1 make CXX=clang++ RELEASE=1 STATIC=1 SDL_STATIC=1 -j$(nproc) 2>&1 | tee build.log || { grep -n -m20 -E "(^| )error:|Error [0-9]+|Killed|internal compiler|virtual memory exhausted|cannot allocate|out of memory|too many|file too big|Segmentation fault" build.log | sed "s/^/::error::/"; exit 1; }

      # Optional gameplay-test asset fetch.
      # DATA.DAT is the copyrighted 1992 asset file — NOT in the repo. If a
      # private URL is configured in the DATA_DAT_URL repo secret, fetch it
      # here so the smoke test exercises real gameplay instead of just init.
      # Without the secret, the test still runs but exits right after init
      # ("AIL sub_1754c: exit", al=0) — that still catches segfault, link
      # errors, SDL dummy driver bugs and replay-parser regressions.
      #
      # Setup:
      #   gh secret set DATA_DAT_URL --body 'https://user:pass@host/DATA.DAT'
      # The secret value is masked in logs by GitHub Actions automatically.
      - name: Cache DATA.DAT
        id: data_cache
        uses: actions/cache@v4
        with:
          path: DATA.DAT
          key: datafile-v1

      - name: Fetch DATA.DAT (cache miss only)
        if: steps.data_cache.outputs.cache-hit != 'true'
        env:
          DATA_DAT_URL: ${{ secrets.DATA_DAT_URL }}
        run: |
          if [ -z "$DATA_DAT_URL" ]; then
            echo "DATA_DAT_URL secret not set — smoke will run init-only"
            exit 0
          fi
          curl --fail --silent --show-error --location \
               --output DATA.DAT "$DATA_DAT_URL"
          echo "Fetched DATA.DAT:"
          ls -lh DATA.DAT
          sha256sum DATA.DAT

      - name: Smoke test
        run: ./tests/smoke.sh

      # Curated gameplay replays (tests/replays/*.inp) verified bit-for-bit
      # against the original (orig vs v2 mirror) under HEADLESS. Each replay runs
      # for exactly its recorded session length (tests/replays/<name>.frames).
      # Needs real DATA.DAT — skipped on forks/PRs where the secret is absent.
      # Runs the replays in parallel across the runner's cores (JOBS=nproc).
      - name: Scenario replays
        if: hashFiles('DATA.DAT') != ''
        run: ./tests/scenarios.sh

  linux:
    # Every Linux bundle is the portable build (2026-09-10): SDL2 built from its
    # source with the default dlopen'ed backends — X11 / Wayland / PulseAudio /
    # PipeWire / ALSA / libdecor are loaded at run time, whatever the machine has
    # — and linked statically, on the 22.04 runners for a glibc 2.35 floor, with
    # clang 18 from apt.llvm.org (the image's clang 14 compiled the executors
    # 3-6 min slower): the binary depends on glibc alone. Ubuntu's libSDL2.a
    # links its backends directly, and the "static" bundles of before needed
    # libpulse, libwayland, libdecor, libsamplerate ... on the target machine.
    # One job for the game and test mode, both architectures.
    name: Linux ${{ matrix.arch }}${{ matrix.test && ' test mode' || '' }} (release, glibc only)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04,     test: false, suffix: '' }
          - { arch: arm64,  runner: ubuntu-22.04-arm, test: false, suffix: '' }   # GitHub's hosted arm64 Linux runner (public repos)
          - { arch: x86_64, runner: ubuntu-22.04,     test: true,  suffix: '-test' }
          - { arch: arm64,  runner: ubuntu-22.04-arm, test: true,  suffix: '-test' }
    env:
      SDL2_VERSION: 2.30.10
      BUNDLE: vikings-linux-${{ matrix.arch }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build deps (the backends' headers only — SDL2 dlopens the libraries at run time) + clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config wget \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && sudo bash /tmp/llvm.sh 18
          clang++-18 --version | head -1

      - name: Cache the SDL2 build
        id: sdl_cache
        uses: actions/cache@v4
        with:
          path: ~/sdl2
          key: sdl2-src-${{ env.SDL2_VERSION }}-${{ matrix.arch }}-ubuntu2204-v1

      - name: Build SDL2 from source (static library, dlopen'ed backends)
        if: steps.sdl_cache.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar -xzf "SDL2-${SDL2_VERSION}.tar.gz"
          cmake -S "SDL2-${SDL2_VERSION}" -B sdl2-build -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DCMAKE_INSTALL_PREFIX="$HOME/sdl2"
          cmake --build sdl2-build -j"$(nproc)"
          cmake --install sdl2-build
          # the link line of the static library: glibc pieces only, no backend may be a link dependency
          grep -E "^Libs" "$HOME/sdl2/lib/pkgconfig/sdl2.pc"

      - name: Build (${{ matrix.test && 'TEST=1 ' || '' }}RELEASE=1 STATIC=1 SDL_STATIC=1 against the source-built SDL2)
        run: |
          # the job log is not readable through the API without admin rights — on a
          # failure the first error lines are surfaced as annotations (check-run API)
          ulimit -s unlimited
          set -o pipefail
          export PKG_CONFIG_PATH="$HOME/sdl2/lib/pkgconfig"
          pkg-config --cflags --libs --static sdl2
          free -g | sed -n 2p | sed 's/^/::notice::runner memory before the build: /'
          ${{ matrix.test && 'TEST=1' || '' }} make CXX=clang++-18 RELEASE=1 STATIC=1 SDL_STATIC=1 -j$(nproc) 2>&1 | tee build.log || { grep -n -m20 -E "(^| )error:|Error [0-9]+|Killed|internal compiler|virtual memory exhausted|cannot allocate|out of memory|too many|file too big|Segmentation fault" build.log | sed "s/^/::error::/"; exit 1; }

      - name: Build keymap editor
        run: PKG_CONFIG_PATH="$HOME/sdl2/lib/pkgconfig" make keymap_editor CXX=clang++-18 STATIC=1 SDL_STATIC=1

      - name: Verify glibc is the only dynamic dependency
        run: |
          ldd vikings
          if ldd vikings | awk '{print $1}' | grep -v -E '^(linux-vdso|libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so|/lib)'; then
            echo "ERROR: a dynamic dependency beyond glibc (listed above)"; exit 1
          fi
          echo "OK: glibc only"

      - name: Package
        run: |
          mkdir -p "dist/$BUNDLE"
          cp vikings vikings_keymap_editor vikings_keymap.cfg "dist/$BUNDLE/"
          # Static DS / EXE blobs needed at runtime by the v2 mirror.
          cp ds_static.bin exe_static.bin "dist/$BUNDLE/"
          [ -f README.md ] && cp README.md "dist/$BUNDLE/"
          # the game's bundles carry the console content builder (README "Console content"): scripts, no game data
          if ! ${{ matrix.test }}; then bash tools/assets/content_tools_bundle.sh "dist/$BUNDLE/content-tools"; fi
          tar -czf "$BUNDLE.tar.gz" -C dist "$BUNDLE"
          ls -lh "$BUNDLE.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}.tar.gz
          retention-days: 30

  windows:
    name: Windows x86_64 (mingw-w64 cross-compile)
    runs-on: ubuntu-latest
    env:
      SDL2_VERSION: 2.30.10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 mingw-w64-tools pkg-config wget unzip

      - name: Install SDL2 mingw devel into mingw sysroot
        # Ubuntu's x86_64-w64-mingw32-pkg-config hardcodes its own
        # PKG_CONFIG_PATH and ignores the env var (it is a shell-script
        # wrapper). Installing SDL2's mingw files directly into the mingw
        # sysroot is the reliable way to make the wrapper find them.
        run: |
          cd /tmp
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          tar -xzf "SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          sudo cp -r "SDL2-${SDL2_VERSION}/x86_64-w64-mingw32/." /usr/x86_64-w64-mingw32/
          # NOTE: the official tarball's sdl2.pc hardcodes the libsdl-org
          # build-machine prefix (/tmp/tardir/...), and Ubuntu's mingw
          # pkg-config wrapper kept resolving that broken file even after a
          # prefix rewrite — so the build steps below bypass pkg-config
          # entirely and pass the SDL flags to make explicitly.
          ls /usr/x86_64-w64-mingw32/include/SDL2/SDL.h

      - name: Build (WIN=1 RELEASE=1 SDL_STATIC=1)
        run: |
          SDLP=/usr/x86_64-w64-mingw32
          # -j2: mingw gcc takes ~3.5 GB and 7 minutes per generated-executor unit
          # (src/sdl/gen/exec_01cN.cpp, measured -O2 -g1 on the largest chunk after the
          # split described in v2_vm_gen.h) — two at a time fit the 16 GB runner, four
          # would not. (The -j2 failures of 77ab302 were not memory: the annotations
          # below showed a Linux-only header in v2_gamestate.cpp, since guarded.)
          set -o pipefail
          free -g | sed -n 2p | sed 's/^/::notice::runner memory before the build: /'
          make WIN=1 RELEASE=1 SDL_STATIC=1 SDL="-I$SDLP/include -I$SDLP/include/SDL2 -L$SDLP/lib -lmingw32 -l:libSDL2.a -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid" -j2 2>&1 | tee build.log || { grep -n -m20 -E "(^| )error:|Error [0-9]+|Killed|internal compiler|virtual memory exhausted|cannot allocate|out of memory|too many|file too big|Segmentation fault" build.log | sed "s/^/::error::/"; exit 1; }

      - name: Build keymap editor
        run: |
          SDLP=/usr/x86_64-w64-mingw32
          make keymap_editor WIN=1 RELEASE=1 SDL_STATIC=1 SDL="-I$SDLP/include -I$SDLP/include/SDL2 -L$SDLP/lib -lmingw32 -l:libSDL2.a -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid"

      - name: Package
        # SDL2 is fully static here, no SDL2.dll alongside the exe.
        run: |
          mkdir -p dist/vikings-windows-x86_64
          cp vikings.exe vikings_keymap_editor.exe vikings_keymap.cfg dist/vikings-windows-x86_64/
          # Static DS / EXE blobs needed at runtime by the v2 mirror.
          cp ds_static.bin exe_static.bin dist/vikings-windows-x86_64/
          [ -f README.md ] && cp README.md dist/vikings-windows-x86_64/
          # the game's bundles carry the console content builder (README "Console content"): scripts, no game data
          bash tools/assets/content_tools_bundle.sh dist/vikings-windows-x86_64/content-tools
          cd dist && zip -r ../vikings-windows-x86_64.zip vikings-windows-x86_64
          ls -lh ../vikings-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vikings-windows-x86_64
          path: vikings-windows-x86_64.zip
          retention-days: 30

  windows-test:
    name: Windows x86_64 test mode (mingw-w64 cross-compile)
    runs-on: ubuntu-latest
    env:
      SDL2_VERSION: 2.30.10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 mingw-w64-tools pkg-config wget unzip

      - name: Install SDL2 mingw devel into mingw sysroot
        run: |
          cd /tmp
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          tar -xzf "SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          sudo cp -r "SDL2-${SDL2_VERSION}/x86_64-w64-mingw32/." /usr/x86_64-w64-mingw32/
          # NOTE: the official tarball's sdl2.pc hardcodes the libsdl-org
          # build-machine prefix (/tmp/tardir/...), and Ubuntu's mingw
          # pkg-config wrapper kept resolving that broken file even after a
          # prefix rewrite — so the build steps below bypass pkg-config
          # entirely and pass the SDL flags to make explicitly.
          ls /usr/x86_64-w64-mingw32/include/SDL2/SDL.h

      - name: Build (TEST=1 WIN=1 RELEASE=1 SDL_STATIC=1)
        run: |
          SDLP=/usr/x86_64-w64-mingw32
          # -j2: see the Windows job above
          set -o pipefail
          free -g | sed -n 2p | sed 's/^/::notice::runner memory before the build: /'
          TEST=1 make WIN=1 RELEASE=1 SDL_STATIC=1 SDL="-I$SDLP/include -I$SDLP/include/SDL2 -L$SDLP/lib -lmingw32 -l:libSDL2.a -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid" -j2 2>&1 | tee build.log || { grep -n -m20 -E "(^| )error:|Error [0-9]+|Killed|internal compiler|virtual memory exhausted|cannot allocate|out of memory|too many|file too big|Segmentation fault" build.log | sed "s/^/::error::/"; exit 1; }

      - name: Build keymap editor
        run: |
          SDLP=/usr/x86_64-w64-mingw32
          make keymap_editor WIN=1 RELEASE=1 SDL_STATIC=1 SDL="-I$SDLP/include -I$SDLP/include/SDL2 -L$SDLP/lib -lmingw32 -l:libSDL2.a -lm -ldinput8 -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lsetupapi -lversion -luuid"

      - name: Package
        run: |
          mkdir -p dist/vikings-windows-x86_64-test
          cp vikings.exe vikings_keymap_editor.exe vikings_keymap.cfg dist/vikings-windows-x86_64-test/
          cp ds_static.bin exe_static.bin dist/vikings-windows-x86_64-test/
          [ -f README.md ] && cp README.md dist/vikings-windows-x86_64-test/
          cd dist && zip -r ../vikings-windows-x86_64-test.zip vikings-windows-x86_64-test
          ls -lh ../vikings-windows-x86_64-test.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vikings-windows-x86_64-test
          path: vikings-windows-x86_64-test.zip
          retention-days: 30

  release:
    # One release on the page: every branch push replaces the rolling
    # pre-release `latest` (the release and its tag are deleted and created
    # again at the new commit — a build-<run>-<sha> release per push littered
    # the page); a v* tag push makes a stable release named after the tag.
    # Skipped for PR events to avoid review-time spam.
    name: Publish GitHub release
    # `test` first: no release is published while the HEADLESS smoke test or
    # the scenario replays fail on either architecture.
    needs: [test, linux, windows, windows-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:                # two pushes in a row must not race on `latest`
      group: release-latest
      cancel-in-progress: false
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-linux-x86_64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-windows-x86_64

      - name: Download Linux test-mode artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-linux-x86_64-test

      - name: Download Windows test-mode artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-windows-x86_64-test

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-linux-arm64

      - name: Download Linux arm64 test-mode artifact
        uses: actions/download-artifact@v4
        with:
          name: vikings-linux-arm64-test

      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
            Auto-build from commit ${{ github.sha }} (${{ github.ref_name }}).

            Assets:
            - `vikings-linux-x86_64.tar.gz`       — Linux x86_64
            - `vikings-windows-x86_64.zip`        — Windows x86_64
            - `vikings-linux-arm64.tar.gz`        — Linux arm64 (aarch64)
            - `vikings-linux-x86_64-test.tar.gz`  — Linux x86_64, **test mode**: the m2c original and the v2 mirror
              in lockstep, every frame cross-checked — the verification build, not the one to play
            - `vikings-windows-x86_64-test.zip`   — Windows x86_64, test mode
            - `vikings-linux-arm64-test.tar.gz`   — Linux arm64 (aarch64), test mode

            All bundles contain `vikings`/`vikings.exe`, `vikings_keymap_editor`,
            `vikings_keymap.cfg`, `ds_static.bin` and `exe_static.bin`. SDL2 and
            the C++ runtime are statically linked — no extra DLLs/.so required.
            The Linux bundles depend on glibc alone (2.35+: Ubuntu 22.04, Debian
            12 and later): SDL2 is built from source with the dlopen'ed backends,
            X11 / Wayland / PulseAudio / PipeWire / ALSA / libdecor are picked up
            at run time from whatever the machine has.
            The game bundles also carry `content-tools/`: the builder of the
            console content pack (SNES parallax, the SNES-only levels, the Genesis
            interludes, languages, SNES sound — README, "Console content") — the
            converters only, no console data: run
            `python3 content-tools/tools/assets/build_content.py` beside `DATA.DAT`
            and your own SNES DE and Genesis images.

            All modes require the copyrighted `DATA.DAT` from a legal copy of
            the 1992 Lost Vikings (e.g. the GOG release). It is not
            redistributed here. The bundled `*_static.bin` files hold the
            static EXE image (initial DS / text / tables) which the game loads
            in place of m2c's C++ initialisers, not the game content.
          NOTES
          sed -i 's/^  //' notes.md   # the heredoc body is indented under the YAML block scalar
          ls -l vikings-*.tar.gz vikings-*.zip

      - name: Rolling pre-release `latest` (every branch push)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          # a `latest` tag left behind without its release would pin the new release to the old commit
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" >/dev/null 2>&1 || true
          gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "latest (${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:8})" --notes-file notes.md \
            vikings-linux-x86_64.tar.gz vikings-windows-x86_64.zip \
            vikings-linux-x86_64-test.tar.gz vikings-windows-x86_64-test.zip \
            vikings-linux-arm64.tar.gz vikings-linux-arm64-test.tar.gz

      - name: Stable release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="vikings-linux-x86_64.tar.gz vikings-windows-x86_64.zip vikings-linux-x86_64-test.tar.gz vikings-windows-x86_64-test.zip vikings-linux-arm64.tar.gz vikings-linux-arm64-test.tar.gz"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md $FILES || \
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $FILES

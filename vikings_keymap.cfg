# Lost Vikings — runtime keymap config.
#
# Loaded at startup. If file is missing or --keymap=<path> not given, built-in
# defaults (identical to entries below) are used.
#
# Format (whitespace-separated):
#   <ACTION>  <SDL_KEY>  [key=0xVAL]  [spec=0xOFF]
#
#   ACTION    Stable name written to .inp replay files (SDL-independent).
#             Multiple lines may share the same ACTION → additional physical
#             keys for the same in-game action (e.g. LCTRL + RCTRL → CTRL).
#   SDL_KEY   Physical key, SDLK_xxx without prefix (e.g. LEFT, SPACE, F10, a).
#             Case-sensitive: letters lowercase, function/named keys uppercase.
#   key=0xV   OR'd into input_keys bitmask while held.
#   spec=0xO  Low byte of DS offset into sdl_spec_state[256] (orig byte_316XX).
#
# Lines starting with '#' or blank are ignored.

# === Directional ===
LEFT       LEFT       key=0x200
RIGHT      RIGHT      key=0x100
UP         UP         key=0x800
DOWN       DOWN       key=0x400
TAB        TAB        key=0x2000

# === Fire / confirm ===
SPACE      SPACE      key=0x8000
RETURN     RETURN     key=0x8000

# === Letter actions ===
E          e          key=0x40
S          s          key=0x80    spec=0x918B    # mute SFX
D          d          key=0x4000
F          f          key=0x8000

# === Modifiers (key bit + spec_off) ===
LCTRL      LCTRL      key=0x20    spec=0x9189
RCTRL      RCTRL      key=0x20    spec=0x9189
LALT       LALT                   spec=0x91A4
RALT       RALT                   spec=0x91A4

# === Spec-only ===
ESC        ESCAPE     key=0x1000
M          m                      spec=0x919E    # mute music
X          x                      spec=0x9199
F10        F10                    spec=0x91B0
DEL        DELETE                 spec=0x91BF
Q          q                      spec=0x917C    # ALT+Q reset
R          r                      spec=0x917F
Y          y                      spec=0x9181    # yes
A          a                      spec=0x918A
N          n                      spec=0x919D    # no
F4         F4                     spec=0x91AA    # INT 3 debug
F5         F5                     spec=0x91AB    # prev level
F6         F6                     spec=0x91AC    # next level
1          1                      spec=0x916E    # viking 1
2          2                      spec=0x916F    # viking 2
3          3                      spec=0x9170    # viking 3

# === Recorder-only (no game effect, kept for trace symmetry) ===
F12        F12

# Co-op key sets (UX stage 8, --coop=N / `# coop N` in a replay): player 2 on
# the numeric keypad, player 3 on letters no DOS hotkey uses. Same key= bits as
# player 1 (0x200/0x100/0x800/0x400 move, 0x8000 action, 0x4000 second button,
# 0x80 use/talk, 0x40 item, 0x20 previous viking, 0x10 next viking, 0x2000 switch).
P2:LEFT    KP_4        key=0x200
P2:RIGHT   KP_6        key=0x100
P2:UP      KP_8        key=0x800
P2:DOWN    KP_2        key=0x400
P2:ACTION  KP_0        key=0x8000
P2:ACTION2 KP_ENTER    key=0x4000
P2:USE     KP_PLUS     key=0x80
P2:ITEM    KP_MINUS    key=0x40
P2:PREV    KP_DIVIDE   key=0x20
P2:NEXT    KP_MULTIPLY key=0x10
P2:SWITCH  KP_PERIOD   key=0x2000
P3:LEFT    j           key=0x200
P3:RIGHT   l           key=0x100
P3:UP      i           key=0x800
P3:DOWN    k           key=0x400
P3:ACTION  u           key=0x8000
P3:ACTION2 o           key=0x4000
P3:USE     p           key=0x80
P3:ITEM    h           key=0x40
P3:PREV    v           key=0x20
P3:NEXT    b           key=0x10
P3:SWITCH  g           key=0x2000

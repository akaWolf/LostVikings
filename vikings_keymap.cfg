# Lost Vikings — runtime keymap config.
#
# Loaded at startup. If file is missing or --keymap=<path> not given, built-in
# defaults (identical to entries below) are used.
#
# Format (whitespace-separated):
#   <ACTION>  <SDL_KEY>  [key=0xVAL]  [spec=0xOFF]
#
#   ACTION    Stable name written to .inp replay files (SDL-independent).
#             Multiple lines may share the same ACTION → additional physical
#             keys for the same in-game action (e.g. LCTRL + RCTRL → CTRL).
#   SDL_KEY   Physical key, SDLK_xxx without prefix (e.g. LEFT, SPACE, F10, a).
#             Case-sensitive: letters lowercase, function/named keys uppercase.
#   key=0xV   OR'd into input_keys bitmask while held.
#   spec=0xO  Low byte of DS offset into sdl_spec_state[256] (orig byte_316XX).
#
# Lines starting with '#' or blank are ignored.

# === Directional ===
LEFT       LEFT       key=0x200
RIGHT      RIGHT      key=0x100
UP         UP         key=0x800
DOWN       DOWN       key=0x400
TAB        TAB        key=0x2000

# === Fire / confirm ===
SPACE      SPACE      key=0x8000
RETURN     RETURN     key=0x8000

# === Letter actions ===
E          e          key=0x40
S          s          key=0x80    spec=0x918B    # mute SFX
D          d          key=0x4000
F          f          key=0x8000

# === Modifiers (key bit + spec_off) ===
LCTRL      LCTRL      key=0x20    spec=0x9189
RCTRL      RCTRL      key=0x20    spec=0x9189
LALT       LALT                   spec=0x91A4
RALT       RALT                   spec=0x91A4

# === Spec-only ===
ESC        ESCAPE     key=0x1000
M          m                      spec=0x919E    # mute music
X          x                      spec=0x9199
F10        F10                    spec=0x91B0
DEL        DELETE                 spec=0x91BF
Q          q                      spec=0x917C    # ALT+Q reset
R          r                      spec=0x917F
Y          y                      spec=0x9181    # yes
A          a                      spec=0x918A
N          n                      spec=0x919D    # no
F4         F4                     spec=0x91AA    # INT 3 debug
F5         F5                     spec=0x91AB    # prev level
F6         F6                     spec=0x91AC    # next level
# 1 / 2 / 3 do nothing in the DOS game (they type password letters); with the
# F1 option KEYS 1/2/3 they select Erik / Baleog / Olaf (bits 0x1 / 0x2 / 0x4,
# ignored while the option is off)
1          1          key=0x1     spec=0x916E    # viking 1 (KEYS 1/2/3 option)
2          2          key=0x2     spec=0x916F    # viking 2
3          3          key=0x4     spec=0x9170    # viking 3

# === Recorder-only (no game effect, kept for trace symmetry) ===
F12        F12

# === The rest of the DOS original's keyboard table ===
# The keypad drives the game too: 8/2/4/6 move, 5 = down, + = action;
# 7 (Home) = the previous viking like Ctrl, 0 (Insert) and 9 (PgUp) = the NEXT
# viking; P = the Esc bit, Caps Lock = the Tab bit. The grey Insert/Home/PgUp
# act as their keypad twins, as under DOS.
KP8        KP_8       key=0x800
KP2        KP_2       key=0x400
KP5        KP_5       key=0x400      # keypad 5 = down
KP4        KP_4       key=0x200
KP6        KP_6       key=0x100
KPPLUS     KP_PLUS    key=0x8000     # action
KP7        KP_7       key=0x20       # previous viking
HOME       HOME       key=0x20       # previous viking
KP0        KP_0       key=0x10       # next viking
KP9        KP_9       key=0x10       # next viking
INS        INSERT     key=0x10       # next viking
PGUP       PGUP       key=0x10       # next viking
P          p          key=0x1000     # pause (the Esc bit)
CAPSLOCK   CAPSLOCK   key=0x2000     # inventory (the Tab bit)

